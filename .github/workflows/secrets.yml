# gitleaks over the caller's whole history, so a key committed and then removed is still found. The caller's
# .gitleaks.toml is the configuration when it has one (gitleaks' defaults otherwise).
name: Secrets

on:
  workflow_call:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          config=()
          [ ! -f .gitleaks.toml ] || config=(--config /repo/.gitleaks.toml)
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact "${config[@]}"
